[project]
name = "crypto_portfolio_rebalancing_agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb<1.0",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "onnxruntime<1.20",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated:DeprecationWarning:chromadb\\.types",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RET"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
